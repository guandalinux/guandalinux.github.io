<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="image-factory-title image-factory-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" lang="fr">
<title id="image-factory-title">De l'image de machine au cluster Kubernetes</title>
<desc id="image-factory-desc">Packer lit ses secrets dans un coffre au moment du build et produit, à partir de deux définitions paramétrées, 14 gabarits OVF prêts pour cloud-init (deux versions de Debian, nœuds Kubernetes, machines virtuelles). Terraform crée ensuite les machines et le cluster Kubernetes RKE2 (réseau Cilium, IP virtuelle du plan de contrôle, sauvegardes etcd toutes les 5 heures, mises à jour nœud par nœud), raccorde le cluster au coffre et à ArgoCD, et conserve ses états chiffrés et verrouillés dans un stockage objet, avec un espace de travail par cluster.</desc>
<style>
.dg-fg{fill:var(--diagram-fg,#1c2330)}
.dg-mu{fill:var(--diagram-muted,#5b6676)}
.dg-box{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-border,#c4ccd8);stroke-width:1.5}
.dg-acc{fill:var(--diagram-accent-soft,#e6effc);stroke:var(--diagram-accent,#2a6fdb);stroke-width:2}
.dg-zone{fill:none;stroke:var(--diagram-border,#c4ccd8);stroke-width:1.5;stroke-dasharray:6 4}
.dg-ln{fill:none;stroke:var(--diagram-fg,#1c2330);stroke-width:1.5}
.dg-lna{fill:none;stroke:var(--diagram-accent,#2a6fdb);stroke-width:2.5}
.dg-dash{stroke-dasharray:5 4}
.dg-mk{fill:var(--diagram-fg,#1c2330)}
.dg-mka{fill:var(--diagram-accent,#2a6fdb)}
.dg-pill{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-fg,#1c2330);stroke-width:1.5}
.dg-chip{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-accent,#2a6fdb);stroke-width:1.5}
</style>
<defs><marker id="image-factory-h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-mk"/></marker><marker id="image-factory-ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-mka"/></marker></defs>
<rect x="8" y="10" width="428" height="438" rx="10" class="dg-zone"/><text x="22" y="34" font-size="16" font-weight="700" class="dg-fg">Gabarits de machines</text>
<rect x="444" y="10" width="428" height="438" rx="10" class="dg-zone"/><text x="458" y="34" font-size="16" font-weight="700" class="dg-fg">Socle en Terraform</text>
<path d="M114,106 V135" class="dg-ln" marker-end="url(#image-factory-h)"/>
<path d="M206,216 H237" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M422,216 H457" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M642,216 H673" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M550,296 V325" class="dg-ln dg-dash" marker-end="url(#image-factory-h)"/>
<path d="M766,296 V325" class="dg-ln" marker-end="url(#image-factory-h)"/>
<rect x="22" y="50" width="184" height="56" rx="8" class="dg-box"/><text x="114" y="73.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Coffre de secrets</text><text x="114" y="91.5" font-size="14" text-anchor="middle" class="dg-mu">lu pendant le build</text>
<rect x="22" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="114" y="175.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Packer</text><text x="114" y="193.5" font-size="14" text-anchor="middle" class="dg-mu">deux définitions</text><text x="114" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">paramétrées :</text><text x="114" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">nœuds Kubernetes</text><text x="114" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">et machines</text><text x="114" y="265.5" font-size="14" text-anchor="middle" class="dg-mu">virtuelles</text>
<rect x="238" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="330" y="166.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">14 gabarits OVF</text><text x="330" y="184.5" font-size="14" text-anchor="middle" class="dg-mu">2 versions de Debian</text><text x="330" y="202.5" font-size="14" text-anchor="middle" class="dg-mu">nœuds de calcul</text><text x="330" y="220.5" font-size="14" text-anchor="middle" class="dg-mu">ou de stockage</text><text x="330" y="238.5" font-size="14" text-anchor="middle" class="dg-mu">VM applicatives,</text><text x="330" y="256.5" font-size="14" text-anchor="middle" class="dg-mu">BDD ou mixtes</text><text x="330" y="274.5" font-size="14" text-anchor="middle" class="dg-mu">prêts cloud-init</text>
<rect x="458" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="550" y="193.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Terraform</text><text x="550" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">modules : machines,</text><text x="550" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">cluster, coffre,</text><text x="550" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">outil GitOps</text>
<rect x="674" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="766" y="157.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Cluster Kubernetes</text><text x="766" y="175.5" font-size="14" text-anchor="middle" class="dg-mu">RKE2, réseau Cilium</text><text x="766" y="193.5" font-size="14" text-anchor="middle" class="dg-mu">IP virtuelle du</text><text x="766" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">plan de contrôle</text><text x="766" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">sauvegardes etcd</text><text x="766" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">toutes les 5 heures</text><text x="766" y="265.5" font-size="14" text-anchor="middle" class="dg-mu">mises à jour nœud</text><text x="766" y="283.5" font-size="14" text-anchor="middle" class="dg-mu">par nœud</text>
<rect x="458" y="326" width="184" height="106" rx="8" class="dg-box"/><text x="550" y="347.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Stockage objet</text><text x="550" y="365.5" font-size="14" text-anchor="middle" class="dg-mu">états chiffrés</text><text x="550" y="383.5" font-size="14" text-anchor="middle" class="dg-mu">et verrouillés,</text><text x="550" y="401.5" font-size="14" text-anchor="middle" class="dg-mu">un espace de travail</text><text x="550" y="419.5" font-size="14" text-anchor="middle" class="dg-mu">par cluster</text>
<rect x="674" y="326" width="184" height="106" rx="8" class="dg-box"/><text x="766" y="356.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Raccordements</text><text x="766" y="374.5" font-size="14" text-anchor="middle" class="dg-mu">coffre de secrets</text><text x="766" y="392.5" font-size="14" text-anchor="middle" class="dg-mu">et ArgoCD, déclarés</text><text x="766" y="410.5" font-size="14" text-anchor="middle" class="dg-mu">en Terraform</text>
</svg>
