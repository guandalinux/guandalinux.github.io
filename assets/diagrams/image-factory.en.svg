<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="880" height="460" role="img" aria-labelledby="image-factory-title image-factory-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" lang="en">
<title id="image-factory-title">From machine image to Kubernetes cluster</title>
<desc id="image-factory-desc">Packer reads its secrets from a vault at build time and, from two parameterised definitions, produces 14 cloud-init ready OVF templates (two Debian versions, Kubernetes nodes, virtual machines). Terraform then creates the machines and the RKE2 Kubernetes cluster (Cilium networking, control plane virtual IP, etcd backups every 5 hours, one-node-at-a-time upgrades), connects the cluster to the vault and to ArgoCD, and keeps its encrypted, locked state in object storage with one workspace per cluster.</desc>
<style>
.dg-fg{fill:var(--diagram-fg,#1c2330)}
.dg-mu{fill:var(--diagram-muted,#5b6676)}
.dg-box{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-border,#c4ccd8);stroke-width:1.5}
.dg-acc{fill:var(--diagram-accent-soft,#e6effc);stroke:var(--diagram-accent,#2a6fdb);stroke-width:2}
.dg-zone{fill:none;stroke:var(--diagram-border,#c4ccd8);stroke-width:1.5;stroke-dasharray:6 4}
.dg-ln{fill:none;stroke:var(--diagram-fg,#1c2330);stroke-width:1.5}
.dg-lna{fill:none;stroke:var(--diagram-accent,#2a6fdb);stroke-width:2.5}
.dg-dash{stroke-dasharray:5 4}
.dg-mk{fill:var(--diagram-fg,#1c2330)}
.dg-mka{fill:var(--diagram-accent,#2a6fdb)}
.dg-pill{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-fg,#1c2330);stroke-width:1.5}
.dg-chip{fill:var(--diagram-surface,#ffffff);stroke:var(--diagram-accent,#2a6fdb);stroke-width:1.5}
</style>
<defs><marker id="image-factory-h" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-mk"/></marker><marker id="image-factory-ha" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-mka"/></marker></defs>
<rect x="8" y="10" width="428" height="438" rx="10" class="dg-zone"/><text x="22" y="34" font-size="16" font-weight="700" class="dg-fg">Machine templates</text>
<rect x="444" y="10" width="428" height="438" rx="10" class="dg-zone"/><text x="458" y="34" font-size="16" font-weight="700" class="dg-fg">Infrastructure as code</text>
<path d="M114,106 V135" class="dg-ln" marker-end="url(#image-factory-h)"/>
<path d="M206,216 H237" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M422,216 H457" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M642,216 H673" class="dg-lna" marker-end="url(#image-factory-ha)"/>
<path d="M550,296 V325" class="dg-ln dg-dash" marker-end="url(#image-factory-h)"/>
<path d="M766,296 V325" class="dg-ln" marker-end="url(#image-factory-h)"/>
<rect x="22" y="50" width="184" height="56" rx="8" class="dg-box"/><text x="114" y="73.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Secrets vault</text><text x="114" y="91.5" font-size="14" text-anchor="middle" class="dg-mu">read at build time</text>
<rect x="22" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="114" y="175.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Packer</text><text x="114" y="193.5" font-size="14" text-anchor="middle" class="dg-mu">two parameterised</text><text x="114" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">definitions:</text><text x="114" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">Kubernetes nodes</text><text x="114" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">and virtual</text><text x="114" y="265.5" font-size="14" text-anchor="middle" class="dg-mu">machines</text>
<rect x="238" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="330" y="166.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">14 OVF templates</text><text x="330" y="184.5" font-size="14" text-anchor="middle" class="dg-mu">2 Debian versions</text><text x="330" y="202.5" font-size="14" text-anchor="middle" class="dg-mu">compute or storage</text><text x="330" y="220.5" font-size="14" text-anchor="middle" class="dg-mu">Kubernetes nodes</text><text x="330" y="238.5" font-size="14" text-anchor="middle" class="dg-mu">app, DB or mixed</text><text x="330" y="256.5" font-size="14" text-anchor="middle" class="dg-mu">VMs</text><text x="330" y="274.5" font-size="14" text-anchor="middle" class="dg-mu">cloud-init ready</text>
<rect x="458" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="550" y="193.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Terraform</text><text x="550" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">modules: machines,</text><text x="550" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">cluster, vault,</text><text x="550" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">GitOps tool</text>
<rect x="674" y="136" width="184" height="160" rx="8" class="dg-acc"/><text x="766" y="157.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Kubernetes cluster</text><text x="766" y="175.5" font-size="14" text-anchor="middle" class="dg-mu">RKE2, Cilium network</text><text x="766" y="193.5" font-size="14" text-anchor="middle" class="dg-mu">control plane</text><text x="766" y="211.5" font-size="14" text-anchor="middle" class="dg-mu">virtual IP</text><text x="766" y="229.5" font-size="14" text-anchor="middle" class="dg-mu">etcd backups</text><text x="766" y="247.5" font-size="14" text-anchor="middle" class="dg-mu">every 5 hours</text><text x="766" y="265.5" font-size="14" text-anchor="middle" class="dg-mu">one node at a time</text><text x="766" y="283.5" font-size="14" text-anchor="middle" class="dg-mu">upgrades</text>
<rect x="458" y="326" width="184" height="106" rx="8" class="dg-box"/><text x="550" y="347.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Object storage</text><text x="550" y="365.5" font-size="14" text-anchor="middle" class="dg-mu">encrypted, locked</text><text x="550" y="383.5" font-size="14" text-anchor="middle" class="dg-mu">state, one</text><text x="550" y="401.5" font-size="14" text-anchor="middle" class="dg-mu">workspace</text><text x="550" y="419.5" font-size="14" text-anchor="middle" class="dg-mu">per cluster</text>
<rect x="674" y="326" width="184" height="106" rx="8" class="dg-box"/><text x="766" y="356.5" font-size="14" font-weight="600" text-anchor="middle" class="dg-fg">Connections</text><text x="766" y="374.5" font-size="14" text-anchor="middle" class="dg-mu">secrets vault and</text><text x="766" y="392.5" font-size="14" text-anchor="middle" class="dg-mu">ArgoCD, declared</text><text x="766" y="410.5" font-size="14" text-anchor="middle" class="dg-mu">in Terraform</text>
</svg>
